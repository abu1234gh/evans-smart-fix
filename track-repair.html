<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track My Repair - Evan's Smart Fix</title><link rel="icon" href="images/logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="auth.css"><style>.track-wrap{width:min(760px,92%);margin:45px auto}.track-card{background:#fff;border:1px solid var(--esf-border);border-radius:18px;padding:25px;box-shadow:var(--esf-shadow)}.track-steps{display:grid;gap:12px;margin-top:20px}.track-step{padding:13px 15px;border-radius:11px;background:#f2f4f7;color:#667085;font-weight:800}.track-step.done{background:#e8f7ef;color:#137a55}.track-step.current{background:var(--esf-blue-soft);color:var(--esf-blue);outline:2px solid #bfd8f4}</style></head><body class="site-redesign"><div class="site-top-strip">Fast, reliable repairs for phones, tablets and laptops</div><header><div class="header-left"><img src="images/logo.png" class="logo" alt="Evan's Smart Fix"><div><h1>Track My Repair</h1><p>Evan's Smart Fix</p></div></div><nav><a href="index.html">Home</a><a href="contact.html">Contact</a></nav></header><main class="track-wrap"><section class="track-card"><div id="lookup"><h2>Repair Tracking</h2><p>Scan the QR on your repair ticket or enter the secure tracking code.</p><div class="auth-field"><label for="token">Tracking code</label><input id="token" autocomplete="off"></div><button id="trackBtn" class="auth-primary" style="margin-top:14px">Track Repair</button></div><div id="result"></div></section></main><script src="auth.js"></script><script>const steps=['Received','Diagnosing','Awaiting Customer Approval','Waiting for Parts','Repairing','Testing','Ready for Collection','Collected'];const qp=new URLSearchParams(location.search),preset=qp.get('token');if(preset)token.value=preset;async function track(){const t=token.value.trim();if(!t)return;result.innerHTML='<p>Loading…</p>';try{const db=await ESFAuth.getClient();const {data,error}=await db.rpc('track_repair',{p_token:t});if(error)throw error;if(!data||!data.ticket_number)throw new Error('Repair not found. Check your tracking code.');const idx=steps.indexOf(data.status);result.innerHTML=`<hr style="margin:22px 0;border:0;border-top:1px solid #e2e8f0"><h2>${safe(data.ticket_number)}</h2><p><b>${safe(data.device_brand)} ${safe(data.device_model)}</b><br>${safe(data.repair_required)}</p><div class="track-steps">${steps.map((s,i)=>`<div class="track-step ${i<idx?'done':i===idx?'current':''}">${i<idx?'✓ ':i===idx?'● ':'○ '}${safe(s)}</div>`).join('')}</div>${data.customer_notes?`<div style="margin-top:20px"><h3>Latest update</h3><p>${safe(data.customer_notes)}</p></div>`:''}<p style="margin-top:20px;color:#667085">Last updated: ${new Date(data.updated_at).toLocaleString('en-GB')}</p>`}catch(e){result.innerHTML='<div style="margin-top:15px;color:#b42318;font-weight:700">'+safe(e.message)+'</div>'}}function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}trackBtn.onclick=track;token.addEventListener('keydown',e=>{if(e.key==='Enter')track()});if(preset)track();</script></body></html>
