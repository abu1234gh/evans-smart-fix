<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff();if(!staff)return;const main=ESFUI.mount('dashboard');main.innerHTML=`<div style="margin-top:30px"><h2 class="staff-page-title">Repair Desk</h2><p class="staff-muted">Live overview of repair tickets.</p><div id="denied"></div><div class="staff-grid" id="stats"></div><div class="staff-grid"><section class="staff-card span-12"><div class="ticket-head"><div><h3>Recent Tickets</h3><p class="staff-muted">Latest repair activity</p></div><a class="staff-btn" href="new-ticket.html" data-permission="create_tickets">+ New Ticket</a></div><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Ticket</th><th>Customer</th><th>Device</th><th>Status</th><th>Updated</th></tr></thead><tbody id="recent"></tbody></table></div></section></div></div>`;if(location.search.includes('denied=1'))denied.innerHTML='<div class="staff-notice error">Your account does not have permission for that area.</div>';const db=await ESFUI.db();const {data,error}=await db.from('repair_tickets').select('id,ticket_number,customer_name,device_brand,device_model,status,updated_at').order('updated_at',{ascending:false}).limit(100);if(error){stats.innerHTML='<div class="staff-card span-12">Database setup is required. See <b>supabase/staff-ticketing-setup.sql</b>.</div>';return}const rows=data||[],count=s=>rows.filter(x=>x.status===s).length;stats.innerHTML=[['Open',rows.filter(x=>!['Collected','Cancelled'].includes(x.status)).length],['Repairing',count('Repairing')],['Waiting for Parts',count('Waiting for Parts')],['Ready',count('Ready for Collection')]].map(x=>`<div class="staff-card staff-stat span-4"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('');recent.innerHTML=rows.slice(0,10).map(r=>`<tr><td><a href="ticket.html?id=${encodeURIComponent(r.id)}"><b>${ESFUI.esc(r.ticket_number)}</b></a></td><td>${ESFUI.esc(r.customer_name)}</td><td>${ESFUI.esc([r.device_brand,r.device_model].filter(Boolean).join(' '))}</td><td><span class="status-pill ${ESFUI.statusClass(r.status)}">${ESFUI.esc(r.status)}</span></td><td>${ESFUI.dt(r.updated_at)}</td></tr>`).join('')||'<tr><td colspan="5">No tickets yet.</td></tr>';document.querySelectorAll('[data-permission]').forEach(el=>el.classList.toggle('hidden',!ESFStaff.has(staff,el.dataset.permission)));});</script></body></html>
