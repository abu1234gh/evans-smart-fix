<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair Ticket - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff('view_tickets');if(!staff)return;const id=new URLSearchParams(location.search).get('id');if(!id){location.replace('tickets.html');return}const main=ESFUI.mount('tickets'),db=await ESFUI.db();let ticket;async function load(){const {data,error}=await db.from('repair_tickets').select('*').eq('id',id).single();if(error){main.innerHTML='<div class="staff-notice error">'+ESFUI.esc(error.message)+'</div>';return}ticket=data;render();loadHistory()}function render(){main.innerHTML=`<div style="margin-top:30px" class="print-ticket"><div class="ticket-head"><div><div class="ticket-number">${ESFUI.esc(ticket.ticket_number)}</div><p class="staff-muted">Created ${ESFUI.dt(ticket.created_at)}</p></div><span class="status-pill ${ESFUI.statusClass(ticket.status)}">${ESFUI.esc(ticket.status)}</span></div>${location.search.includes('created=1')?'<div class="staff-notice success no-print">Ticket created successfully.</div>':''}<div class="staff-grid"><section class="staff-card span-6"><h3>Customer</h3><p><b>${ESFUI.esc(ticket.customer_name)}</b><br>${ESFUI.esc(ticket.customer_phone||'')}<br>${ESFUI.esc(ticket.customer_email||'')}</p><h3 style="margin-top:18px">Device</h3><p>${ESFUI.esc(ticket.device_brand)} ${ESFUI.esc(ticket.device_model)}<br>${ticket.serial_imei?'IMEI / Serial: '+ESFUI.esc(ticket.serial_imei):''}</p><h3 style="margin-top:18px">Repair</h3><p>${ESFUI.esc(ticket.repair_required)}</p>${ticket.accessories_left?'<p><b>Accessories:</b> '+ESFUI.esc(ticket.accessories_left)+'</p>':''}</section><section class="staff-card span-6"><h3>Ticket Details</h3><p>Quoted: <b>${ESFUI.money(ticket.quoted_price)}</b><br>Deposit: <b>${ESFUI.money(ticket.deposit_amount)}</b><br>Payments recorded: <b>${ESFUI.money(ticket.amount_paid)}</b></p><div class="staff-field no-print" style="margin-top:15px"><label>Status</label><select id="statusSelect"><option>Received</option><option>Diagnosing</option><option>Awaiting Customer Approval</option><option>Waiting for Parts</option><option>Repairing</option><option>Testing</option><option>Ready for Collection</option><option>Collected</option><option>Cancelled</option></select></div><div class="staff-actions no-print"><button id="updateStatus" class="staff-btn" data-permission="update_status">Update Status</button><button onclick="window.print()" class="staff-btn secondary" data-permission="print_tickets">Print Ticket</button><button id="refundBtn" class="staff-btn danger" data-permission="issue_refunds">Record Refund</button><button id="overrideBtn" class="staff-btn danger">Manager Override</button></div><div id="actionMsg"></div><div style="margin-top:20px;text-align:center"><canvas id="qr"></canvas><p class="staff-muted">Scan to track this repair</p></div></section><section class="staff-card span-6"><h3>Internal Notes</h3><p>${ESFUI.esc(ticket.internal_notes||'No internal notes.')}</p></section><section class="staff-card span-6"><h3>Customer Update</h3><p>${ESFUI.esc(ticket.customer_notes||'No customer-visible update.')}</p></section><section class="staff-card span-12 no-print"><h3>Activity</h3><div id="history" class="timeline"></div></section></div></div>`;statusSelect.value=ticket.status;const canRefund=ESFStaff.has(staff,'issue_refunds');refundBtn.classList.toggle('hidden',!canRefund);overrideBtn.classList.toggle('hidden',canRefund);updateStatus.classList.toggle('hidden',!ESFStaff.has(staff,'update_status'));const trackUrl=new URL('../track-repair.html',location.href);trackUrl.searchParams.set('token',ticket.tracking_token);if(window.QRCode)QRCode.toCanvas(qr,trackUrl.href,{width:150,margin:1});updateStatus.onclick=async()=>{const {error}=await db.from('repair_tickets').update({status:statusSelect.value}).eq('id',id);if(error)return show(error.message,'error');show('Status updated.','success');load()};refundBtn.onclick=()=>refundFlow(false);overrideBtn.onclick=()=>refundFlow(true)}async function refundFlow(needsOverride){const amount=prompt('Refund amount (£):');if(amount===null)return;const n=Number(amount);if(!Number.isFinite(n)||n<=0)return show('Enter a valid refund amount.','error');let pin=null;if(needsOverride){pin=prompt('Manager override PIN:');if(!pin)return;const {data,error}=await db.rpc('grant_refund_override',{p_ticket_id:id,p_amount:n,p_pin:pin});if(error||!data?.ok)return show(data?.message||error?.message||'Override denied.','error')}const reason=prompt('Refund reason:');if(!reason)return;const {data,error}=await db.rpc('record_ticket_refund',{p_ticket_id:id,p_amount:n,p_reason:reason});if(error||!data?.ok)return show(data?.message||error?.message||'Refund could not be recorded.','error');show('Refund recorded in the repair system.','success');load()}function show(t,type){actionMsg.innerHTML='<div class="staff-notice '+type+'">'+ESFUI.esc(t)+'</div>'}async function loadHistory(){const {data}=await db.from('ticket_audit_log').select('*').eq('ticket_id',id).order('created_at',{ascending:false}).limit(100);if(document.getElementById('history'))history.innerHTML=(data||[]).map(x=>`<div class="timeline-item"><strong>${ESFUI.esc(x.action)}</strong><small>${ESFUI.dt(x.created_at)} • ${ESFUI.esc(x.actor_name||'System')}</small>${x.details?'<div>'+ESFUI.esc(JSON.stringify(x.details))+'</div>':''}</div>`).join('')||'<p>No activity yet.</p>'}await load()});</script></body></html>
