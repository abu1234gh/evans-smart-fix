<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Repair Ticket - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff('create_tickets');if(!staff)return;const main=ESFUI.mount('new');main.innerHTML=`<div style="margin-top:30px"><h2 class="staff-page-title">New Repair Ticket</h2><p class="staff-muted">Create a walk-in or staff-entered repair.</p><section class="staff-card" style="margin-top:22px"><form id="ticketForm" class="staff-form"><div class="staff-field"><label>Customer name *</label><input name="customer_name" required></div><div class="staff-field"><label>Phone number</label><input name="customer_phone" type="tel"></div><div class="staff-field"><label>Email</label><input name="customer_email" type="email"></div><div class="staff-field"><label>Device brand *</label><input name="device_brand" required></div><div class="staff-field"><label>Device model *</label><input name="device_model" required></div><div class="staff-field"><label>IMEI / Serial</label><input name="serial_imei"></div><div class="staff-field full"><label>Fault / repair required *</label><textarea name="repair_required" required></textarea></div><div class="staff-field full"><label>Accessories left with device</label><input name="accessories_left" placeholder="e.g. case, charger"></div><div class="staff-field"><label>Quoted price (£)</label><input name="quoted_price" type="number" min="0" step="0.01"></div><div class="staff-field"><label>Deposit (£)</label><input name="deposit_amount" type="number" min="0" step="0.01"></div><div class="staff-field"><label>Status</label><select name="status"><option>Received</option><option>Diagnosing</option><option>Awaiting Customer Approval</option><option>Waiting for Parts</option><option>Repairing</option><option>Testing</option><option>Ready for Collection</option></select></div><div class="staff-field full"><label>Internal staff notes</label><textarea name="internal_notes"></textarea></div><div class="staff-field full"><label>Customer-visible update</label><textarea name="customer_notes"></textarea></div><div class="staff-field full"><div class="staff-actions"><button class="staff-btn" id="saveBtn">Create Ticket</button><a class="staff-btn secondary" href="dashboard.html">Cancel</a></div><div id="msg"></div></div></form></section></div>`;ticketForm.onsubmit=async e=>{e.preventDefault();saveBtn.disabled=true;msg.innerHTML='';try{const fd=new FormData(ticketForm),payload=Object.fromEntries(fd.entries());['quoted_price','deposit_amount'].forEach(k=>payload[k]=payload[k]===''?0:Number(payload[k]));const db=await ESFUI.db();const {data,error}=await db.from('repair_tickets').insert(payload).select('id,ticket_number').single();if(error)throw error;location.href='ticket.html?id='+encodeURIComponent(data.id)+'&created=1'}catch(err){msg.innerHTML='<div class="staff-notice error">'+ESFUI.esc(err.message)+'</div>';saveBtn.disabled=false}}});</script></body></html>
