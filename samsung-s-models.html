<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo.png">
    <style>
        body {

            margin: 0;
            background: #fff;

        }

        header {
            background: #0057b8;
            color: white;
            padding: 20px;
        }

        .logo {
            width: 100px;

        .nav-bar a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        .brands {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .model {
            width: 150px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            background: #fff;
            transition: 0.2s;
        }

        .model:hover {
            transform: scale(1.05);
        }

        .model a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .model img {
            width: 120px;
            height: 130px;
            object-fit: contain;
        }
    </style>
</head>
