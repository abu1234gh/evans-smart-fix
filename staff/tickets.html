<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair Tickets - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff('view_tickets');if(!staff)return;const main=ESFUI.mount('tickets');main.innerHTML=`<div style="margin-top:30px"><div class="ticket-head"><div><h2 class="staff-page-title">Repair Tickets</h2><p class="staff-muted">Search and manage repairs.</p></div><a class="staff-btn" href="new-ticket.html" data-permission="create_tickets">+ New Ticket</a></div><section class="staff-card" style="margin-top:22px"><div class="staff-form"><div class="staff-field"><label>Search</label><input id="q" placeholder="Ticket, customer, phone or device"></div><div class="staff-field"><label>Status</label><select id="filter"><option value="">All statuses</option><option>Received</option><option>Diagnosing</option><option>Awaiting Customer Approval</option><option>Waiting for Parts</option><option>Repairing</option><option>Testing</option><option>Ready for Collection</option><option>Collected</option><option>Cancelled</option></select></div></div><div class="staff-table-wrap" style="margin-top:16px"><table class="staff-table"><thead><tr><th>Ticket</th><th>Customer</th><th>Phone</th><th>Device</th><th>Status</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>`;const db=await ESFUI.db();let all=[];async function load(){const {data,error}=await db.from('repair_tickets').select('*').order('created_at',{ascending:false}).limit(500);if(error){rows.innerHTML='<tr><td colspan="6">'+ESFUI.esc(error.message)+'</td></tr>';return}all=data||[];render()}function render(){const s=q.value.trim().toLowerCase(),f=filter.value;const out=all.filter(r=>(!f||r.status===f)&&(!s||[r.ticket_number,r.customer_name,r.customer_phone,r.device_brand,r.device_model].some(v=>String(v||'').toLowerCase().includes(s))));rows.innerHTML=out.map(r=>`<tr><td><a href="ticket.html?id=${encodeURIComponent(r.id)}"><b>${ESFUI.esc(r.ticket_number)}</b></a></td><td>${ESFUI.esc(r.customer_name)}</td><td>${ESFUI.esc(r.customer_phone)}</td><td>${ESFUI.esc([r.device_brand,r.device_model].filter(Boolean).join(' '))}</td><td><span class="status-pill ${ESFUI.statusClass(r.status)}">${ESFUI.esc(r.status)}</span></td><td>${ESFUI.dt(r.updated_at)}</td></tr>`).join('')||'<tr><td colspan="6">No matching tickets.</td></tr>'}q.oninput=filter.onchange=render;await load();document.querySelectorAll('[data-permission]').forEach(el=>el.classList.toggle('hidden',!ESFStaff.has(staff,el.dataset.permission)));});</script></body></html>
