<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Evan's Smart Fix</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" href="images/logo.png">
</head>
<body>

<header>
    <img src="images/logo.png" class="logo" alt="Evan's Smart Fix logo">
    <h1>Create Account</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="brands.html">Repairs</a>
        <a href="cart.html" class="cart-link">🛒 Basket <span id="cartCount">0</span></a>
    </nav>
</header>

<main class="auth-page">
    <section class="auth-card">
        <h2>Create your account</h2>
        <p class="auth-subtitle">Save your details and keep your repair bookings in one place.</p>

        <form id="registerForm" class="auth-form">
            <div class="auth-field">
                <label for="name">Full name</label>
                <input type="text" id="name" autocomplete="name" required>
            </div>

            <div class="auth-field">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" autocomplete="tel" required>
            </div>

            <div class="auth-field">
                <label for="address">Address</label>
                <input type="text" id="address" autocomplete="street-address">
            </div>

            <div class="auth-field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="new-password" minlength="8" required>
            </div>

            <div class="auth-field">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" class="auth-primary" id="registerButton">Create Account</button>
            <p id="authStatus" class="auth-status" aria-live="polite"></p>
        </form>

        <div class="auth-links">
            Already have an account?
            <a id="loginLink" href="login.html">Log In</a>
        </div>
    </section>
</main>

<script src="auth.js"></script>
<script>
(function () {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCount = document.getElementById("cartCount");
    if (cartCount) cartCount.textContent = cart.length;

    const nextPage = window.ESFAuth.safeNext("account.html");
    document.getElementById("loginLink").href = "login.html?next=" + encodeURIComponent(nextPage);

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const status = document.getElementById("authStatus");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const fullName = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const address = document.getElementById("address").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        status.className = "auth-status";

        if (password !== confirmPassword) {
            status.className = "auth-status error";
            status.textContent = "The passwords don't match.";
            return;
        }

        button.disabled = true;
        status.textContent = "Creating your account...";

        try {
            const client = await window.ESFAuth.getClient();
            const emailRedirectTo = new URL("login.html", window.location.href).href;

            const { data, error } = await client.auth.signUp({
                email,
                password,
                options: {
                    emailRedirectTo,
                    data: {
                        full_name: fullName,
                        phone,
                        address
                    }
                }
            });

            if (error) throw error;

            if (data.session) {
                localStorage.setItem("checkoutMode", "account");
                window.location.href = nextPage;
                return;
            }

            status.className = "auth-status success";
            status.textContent = "Account created. Check your email to confirm it, then log in.";
            button.disabled = false;
        } catch (error) {
            status.className = "auth-status error";
            status.textContent = error.message || "We couldn't create your account.";
            button.disabled = false;
        }
    });
})();
</script>
<script src="social-dropdown.js"></script>
<script src="whatsapp.js"></script>
</body>
</html>
