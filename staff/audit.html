<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit Log - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff('view_audit');if(!staff)return;const main=ESFUI.mount('audit');main.innerHTML=`<div style="margin-top:30px"><h2 class="staff-page-title">Audit Log</h2><p class="staff-muted">Important staff and ticket actions.</p><section class="staff-card" style="margin-top:22px"><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Time</th><th>Staff</th><th>Action</th><th>Ticket</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>`;const db=await ESFUI.db();const {data,error}=await db.from('ticket_audit_log').select('*').order('created_at',{ascending:false}).limit(500);rows.innerHTML=error?`<tr><td colspan="5">${ESFUI.esc(error.message)}</td></tr>`:(data||[]).map(x=>`<tr><td>${ESFUI.dt(x.created_at)}</td><td>${ESFUI.esc(x.actor_name||'System')}</td><td>${ESFUI.esc(x.action)}</td><td>${ESFUI.esc(x.ticket_number||'—')}</td><td>${ESFUI.esc(x.details?JSON.stringify(x.details):'')}</td></tr>`).join('')});</script></body></html>
