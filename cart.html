<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo.png">
<title>Your Basket</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f7f6f9;
}

header {
    background: #0057b8;
    color: white;
    padding: 20px;
    text-align: center;
}

#cartBox {
    margin: 20px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    border: 2px solid #0057b8;
    text-align: center;
}

#total {
    text-align: center;
    margin: 20px 0 0;
}

.item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

button {
    background: #0057b8;
    color: white;
    border: none;
    padding: 7px 14px;
    cursor: pointer;
    margin-top: 10px;
    border-radius: 6px;
    width: auto;
}

.cart-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 10px auto 20px;
}

.cart-actions button {
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>Your Basket</h1>
         <nav>
        <a href="index.html">Home</a>
        <a href="brands.html">Repairs</a>
<details class="social-dropdown">
    <summary>Socials ▾</summary>

    <div class="social-dropdown-menu">

        <a href="YOUR_INSTAGRAM_LINK"
           target="_blank"
           rel="noopener noreferrer">
            Instagram
        </a>

        <a href="YOUR_TIKTOK_LINK"
           target="_blank"
           rel="noopener noreferrer">
            TikTok
        </a>

      
    </div>
</details>

<a href="cart.html" class="cart-link">
    🛒 Basket
    <span id="cartCount">0</span>
</a>
     </nav>
</header>
<div id="total"></div>
<div id="cartBox"></div>

<div class="cart-actions">
    <button onclick="window.location.href='brands.html'">Add Another Item</button>
    <button onclick="checkout()">Proceed to Checkout</button>
</div>

<script>

let cart = JSON.parse(
    localStorage.getItem("cart")
) || [];

function renderCart() {

    const box =
    document.getElementById("cartBox");

    const totalBox =
    document.getElementById("total");

    box.innerHTML = "";

    document.getElementById(
        "cartCount"
    ).textContent = cart.length;

    if(cart.length===0){

        box.innerHTML =
        "<p>Your basket is empty</p>";

        totalBox.innerHTML =
        "<strong>Total: £0.00</strong>";

        return;
    }

    let total = 0;

    cart.forEach((item,index)=>{

        total += Number(item.price);

        const div =
        document.createElement("div");

        div.className = "item";

        div.innerHTML = `

<div>

<strong>${item.model}</strong>

<br>

${item.repair}

<br>

<small>${item.quality}</small>

<br>

£${Number(item.price).toFixed(2)}

</div>

<button onclick="removeItem(${index})">

Remove

</button>

`;

        box.appendChild(div);

    });

    totalBox.innerHTML =

    "<strong>Total: £"
    + total.toFixed(2)
    + "</strong>";

}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    renderCart();

}

function checkout(){

    // Re-read the basket at the exact moment Checkout is clicked.
    // This avoids using an old in-memory copy of the cart.
    let checkoutCart = [];

    try {
        checkoutCart = JSON.parse(localStorage.getItem("cart")) || [];
    } catch (error) {
        console.error("Could not read basket from localStorage:", error);
    }

    // Fall back to the cart currently displayed on this page.
    if (!checkoutCart.length && Array.isArray(cart) && cart.length) {
        checkoutCart = cart;
    }

    if(checkoutCart.length===0){

        alert(
            "Your basket is empty"
        );

        return;

    }

    // Save the basket in BOTH localStorage and sessionStorage before
    // moving pages. checkout-choice.html can restore it from the backup
    // if the browser temporarily fails to read the normal cart value.
    localStorage.setItem(
        "cart",
        JSON.stringify(checkoutCart)
    );

    sessionStorage.setItem(
        "checkoutCartBackup",
        JSON.stringify(checkoutCart)
    );

    window.location.href =
    "checkout-choice.html";

}

document.addEventListener(
"DOMContentLoaded",
function(){

cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

renderCart();

});

</script>


<script src="social-dropdown.js"></script>
  <script src="whatsapp.js"></script>
</body>
</html>
