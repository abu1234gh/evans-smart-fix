<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment Successful - Evan's Smart Fix
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        .payment-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px 25px;
        }

        .payment-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        #status {
            font-size: 18px;
            line-height: 1.6;
        }

    </style>

    <link rel="icon" href="images/logo.png">
</head>

<body>

    <div class="payment-container">

        <div
            class="payment-icon"
            id="paymentIcon"
        >
            ⏳
        </div>

        <h1 id="title">
            Checking Payment
        </h1>

        <p id="status">
            Please wait while we confirm your payment...
        </p>

    </div>


    <!-- =====================================================
         EMAILJS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>


    <script>

        /* =====================================================
           EMAILJS
        ===================================================== */

        emailjs.init(
            "fOQMvcH10BYyM_Y9O"
        );


        /* =====================================================
           SUPABASE PAYMENT CHECK FUNCTION
        ===================================================== */

        const CHECK_PAYMENT_URL =
            "https://tblqoawewcyomwgjahry.supabase.co/functions/v1/check-sumup-payment";


        /* =====================================================
           PAGE ELEMENTS
        ===================================================== */

        const statusElement =
            document.getElementById("status");

        const titleElement =
            document.getElementById("title");

        const paymentIcon =
            document.getElementById("paymentIcon");


        /* =====================================================
           BOOKING DATA
        ===================================================== */

        const booking =
            JSON.parse(
                localStorage.getItem(
                    "bookingData"
                )
            );


        /* =====================================================
           CHECK BOOKING DATA
        ===================================================== */

        if (!booking) {

            titleElement.textContent =
                "Order Information Missing";

            statusElement.textContent =
                "We couldn't find your order information. Please contact Evan's Smart Fix.";

            paymentIcon.textContent =
                "⚠️";

            throw new Error(
                "bookingData not found"
            );

        }


        /* =====================================================
           CHECK SUMUP PAYMENT
        ===================================================== */

        async function checkPayment() {

            try {

                /* =================================================
                   CHECK CHECKOUT ID
                ================================================= */

                if (
                    !booking.sumupCheckoutId
                ) {

                    throw new Error(
                        "SumUp checkout ID not found."
                    );

                }


                /* =================================================
                   UPDATE STATUS
                ================================================= */

                titleElement.textContent =
                    "Checking Payment";

                statusElement.textContent =
                    "Confirming your payment securely...";


                /* =================================================
                   CALL SUPABASE
                ================================================= */

                const response =
                    await fetch(
                        CHECK_PAYMENT_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    checkoutId:
                                        booking.sumupCheckoutId

                                })

                        }
                    );


                /* =================================================
                   READ RESPONSE
                ================================================= */

                const data =
                    await response.json();


                console.log(
                    "SUMUP PAYMENT STATUS:",
                    data
                );


                /* =================================================
                   CHECK API RESPONSE
                ================================================= */

                if (!response.ok) {

                    console.error(
                        "PAYMENT CHECK ERROR:",
                        data
                    );

                    throw new Error(
                        "Unable to verify payment."
                    );

                }


                /* =================================================
                   PAYMENT VALUES
                ================================================= */

                const paymentAmount =
                    Number(
                        data.amount
                    );


                const bookingAmount =
                    Number(
                        booking.total
                    );


                const paymentCurrency =
                    data.currency;


                const paymentStatus =
                    data.status;


                console.log(
                    "Payment status:",
                    paymentStatus
                );

                console.log(
                    "Payment amount:",
                    paymentAmount
                );

                console.log(
                    "Booking amount:",
                    bookingAmount
                );

                console.log(
                    "Currency:",
                    paymentCurrency
                );


                /* =================================================
                   PAYMENT SUCCESSFUL
                ================================================= */

                if (
                    paymentStatus === "PAID" &&
                    paymentCurrency === "GBP" &&
                    paymentAmount === bookingAmount
                ) {

                    paymentIcon.textContent =
                        "✓";

                    titleElement.textContent =
                        "Payment Successful!";

                    statusElement.textContent =
                        "Your payment has been confirmed. Completing your order...";


                    /* =================================================
                       SEND CUSTOMER EMAIL
                    ================================================= */

                    try {

                        await emailjs.send(
                            "service_nijiuhj",
                            "template_xqu1fle",
                            booking
                        );

                        console.log(
                            "Customer email sent successfully."
                        );

                    } catch (
                        customerEmailError
                    ) {

                        console.error(
                            "CUSTOMER EMAIL ERROR:",
                            customerEmailError
                        );

                    }


                    /* =================================================
                       SEND BUSINESS EMAIL
                    ================================================= */

                    try {

                        await emailjs.send(
                            "service_nijiuhj",
                            "template_z80ezit",
                            booking
                        );

                        console.log(
                            "Business email sent successfully."
                        );

                    } catch (
                        businessEmailError
                    ) {

                        console.error(
                            "BUSINESS EMAIL ERROR:",
                            businessEmailError
                        );

                    }


                    /* =================================================
                       CLEAR CART
                    ================================================= */

                    localStorage.removeItem(
                        "cart"
                    );


                    /* =================================================
                       FINAL MESSAGE
                    ================================================= */

                    if (booking.order_type === "Accessory Order") {

                        titleElement.textContent =
                            "Order Confirmed!";

                        statusElement.innerHTML =
                            "Thank you for choosing Evan's Smart Fix.<br><br>" +
                            "Your payment has been confirmed and your accessory order has been received.";

                    } else if (
                        booking.order_type ===
                        "Repair & Accessory Order"
                    ) {

                        titleElement.textContent =
                            "Order Confirmed!";

                        statusElement.innerHTML =
                            "Thank you for choosing Evan's Smart Fix.<br><br>" +
                            "Your payment has been confirmed and your repair booking and accessory order have been received.";

                    } else {

                        titleElement.textContent =
                            "Booking Confirmed!";

                        statusElement.innerHTML =
                            "Thank you for choosing Evan's Smart Fix.<br><br>" +
                            "Your payment has been confirmed and your repair booking has been received.";
                    }


                    /* =================================================
                       RETURN HOME
                    ================================================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        5000
                    );


                    return;

                }


                /* =================================================
                   PAYMENT STILL PENDING
                ================================================= */

                if (
                    paymentStatus === "PENDING"
                ) {

                    paymentIcon.textContent =
                        "⏳";

                    titleElement.textContent =
                        "Payment Processing";

                    statusElement.textContent =
                        "Your payment is still being processed. Checking again shortly...";


                    setTimeout(
                        checkPayment,
                        3000
                    );


                    return;

                }


                /* =================================================
                   PAYMENT FAILED
                ================================================= */

                if (
                    paymentStatus === "FAILED"
                ) {

                    paymentIcon.textContent =
                        "✕";

                    titleElement.textContent =
                        "Payment Failed";

                    statusElement.textContent =
                        "Your payment was not completed. Please return to your booking and try again.";

                    return;

                }


                /* =================================================
                   PAYMENT EXPIRED
                ================================================= */

                if (
                    paymentStatus === "EXPIRED"
                ) {

                    paymentIcon.textContent =
                        "⌛";

                    titleElement.textContent =
                        "Payment Expired";

                    statusElement.textContent =
                        "This payment session has expired. Please return to your booking and try again.";

                    return;

                }


                /* =================================================
                   AMOUNT / CURRENCY MISMATCH
                ================================================= */

                if (
                    paymentStatus === "PAID" &&
                    (
                        paymentCurrency !== "GBP" ||
                        paymentAmount !== bookingAmount
                    )
                ) {

                    console.error(
                        "PAYMENT MISMATCH",
                        {
                            paymentAmount:
                                paymentAmount,

                            bookingAmount:
                                bookingAmount,

                            paymentCurrency:
                                paymentCurrency
                        }
                    );


                    paymentIcon.textContent =
                        "⚠️";

                    titleElement.textContent =
                        "Payment Verification Issue";

                    statusElement.textContent =
                        "We received a payment response, but the payment details do not match your booking. Please contact Evan's Smart Fix.";

                    return;

                }


                /* =================================================
                   UNKNOWN STATUS
                ================================================= */

                paymentIcon.textContent =
                    "⚠️";

                titleElement.textContent =
                    "Payment Status Unknown";

                statusElement.textContent =
                    "We couldn't confirm your payment status. Please contact Evan's Smart Fix.";

            } catch (error) {

                console.error(
                    "PAYMENT VERIFICATION ERROR:",
                    error
                );


                paymentIcon.textContent =
                    "⚠️";

                titleElement.textContent =
                    "Unable to Confirm Payment";

                statusElement.textContent =
                    "We couldn't confirm your payment right now. Please contact Evan's Smart Fix.";

            }

        }


        /* =====================================================
           START PAYMENT CHECK
        ===================================================== */

        checkPayment();

    </script>


    <!-- =====================================================
         WHATSAPP
    ===================================================== -->

  <script src="whatsapp.js"></script>
</body>

</html>
