<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script src="repairflow.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const s=await ESFStaff.requireStaff('view_tickets');if(!s)return;const m=ESFUI.mount('inventory');m.innerHTML='<div style="margin-top:30px"><h2 class="staff-page-title">Parts Inventory</h2><p class="staff-muted">Stock, costs, suppliers and low-stock alerts.</p><section class="staff-card" style="margin-top:22px"><form id="f" class="staff-form"><div class="staff-field"><label>Part name *</label><input name="name" required></div><div class="staff-field"><label>SKU</label><input name="sku"></div><div class="staff-field"><label>Supplier</label><input name="supplier"></div><div class="staff-field"><label>Purchase cost</label><input name="purchase_cost" type="number" step="0.01"></div><div class="staff-field"><label>Sale price</label><input name="sale_price" type="number" step="0.01"></div><div class="staff-field"><label>Stock</label><input name="stock_quantity" type="number" min="0"></div><div class="staff-field"><label>Minimum stock</label><input name="minimum_stock" type="number" min="0"></div><div class="staff-field"><button class="staff-btn">Save part</button></div></form></section><section class="staff-card" style="margin-top:22px"><input id="q" placeholder="Search parts"><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Part</th><th>SKU</th><th>Supplier</th><th>Cost</th><th>Sale</th><th>Stock</th><th>Min</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>';const db=await ESFUI.db();let all=[];async function load(){const r=await db.from('repair_parts').select('*').order('name');if(r.error){rows.innerHTML='<tr><td colspan="7">Run the Supabase RepairFlow migration first.</td></tr>';return}all=r.data||[];render()}function render(){const t=q.value.toLowerCase();rows.innerHTML=all.filter(x=>!t||[x.name,x.sku,x.supplier].some(v=>String(v||'').toLowerCase().includes(t))).map(x=>'<tr><td>'+ESFRF.esc(x.name)+'</td><td>'+ESFRF.esc(x.sku||'—')+'</td><td>'+ESFRF.esc(x.supplier||'—')+'</td><td>'+ESFRF.money(x.purchase_cost)+'</td><td>'+ESFRF.money(x.sale_price)+'</td><td><b>'+x.stock_quantity+'</b></td><td>'+x.minimum_stock+'</td></tr>').join('')||'<tr><td colspan="7">No parts.</td></tr>'}f.onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(f).entries());['purchase_cost','sale_price'].forEach(k=>p[k]=Number(p[k]||0));['stock_quantity','minimum_stock'].forEach(k=>p[k]=parseInt(p[k]||0,10));const r=await db.from('repair_parts').upsert(p,{onConflict:'sku'});if(r.error)return alert(r.error.message);f.reset();load()};q.oninput=render;load()});</script></body></html>
