<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Management - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff('manage_staff');if(!staff)return;const main=ESFUI.mount('staff');main.innerHTML=`<div style="margin-top:30px"><h2 class="staff-page-title">Staff Management</h2><p class="staff-muted">Manage roles and access. Create the person's Supabase Auth account first, then add their User UUID here.</p><section class="staff-card" style="margin-top:22px"><h3>Add / Update Staff Access</h3><form id="form" class="staff-form" style="margin-top:15px"><div class="staff-field"><label>Supabase User UUID *</label><input name="user_id" required></div><div class="staff-field"><label>Display name *</label><input name="display_name" required></div><div class="staff-field"><label>Role</label><select name="role"><option value="staff">General Staff</option><option value="admin">Admin</option></select></div><div class="staff-field"><label>Active</label><select name="active"><option value="true">Yes</option><option value="false">No</option></select></div><div class="staff-field full"><label>General Staff Permissions</label><div id="perms" class="permission-list"></div></div><div class="staff-field full"><button class="staff-btn">Save Staff Access</button><div id="msg"></div></div></form></section><section class="staff-card" style="margin-top:18px"><h3>Current Staff</h3><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Name</th><th>Role</th><th>Active</th><th>User ID</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="staff-card" style="margin-top:18px"><h3>Manager Override PIN</h3><p class="staff-muted">The PIN is hashed by the database. It is never stored in the website code.</p><div class="staff-form"><div class="staff-field"><label>New 6+ digit PIN</label><input id="pin" type="password" inputmode="numeric" minlength="6"></div><div class="staff-field"><label>Default override minutes</label><input id="mins" type="number" min="1" max="120" value="15"></div></div><div class="staff-actions"><button id="setPin" class="staff-btn">Set Manager PIN</button></div><div id="pinMsg"></div></section></div>`;perms.innerHTML=ESFStaff.PERMS.filter(p=>!['manage_staff','view_audit','system_settings'].includes(p)).map(p=>`<label class="permission-item"><input type="checkbox" name="perm" value="${p}" ${p==='issue_refunds'?'':'checked'}> ${p.replaceAll('_',' ')}</label>`).join('');const db=await ESFUI.db();async function load(){const {data,error}=await db.from('staff_profiles').select('*').order('display_name');rows.innerHTML=error?`<tr><td colspan="4">${ESFUI.esc(error.message)}</td></tr>`:(data||[]).map(s=>`<tr><td>${ESFUI.esc(s.display_name)}</td><td><span class="role-pill">${ESFUI.esc(s.role)}</span></td><td>${s.active?'Yes':'No'}</td><td><code>${ESFUI.esc(s.user_id)}</code></td></tr>`).join('')}form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),permissions={};ESFStaff.PERMS.forEach(p=>permissions[p]=false);fd.getAll('perm').forEach(p=>permissions[p]=true);const payload={user_id:fd.get('user_id'),display_name:fd.get('display_name'),role:fd.get('role'),active:fd.get('active')==='true',permissions};const {error}=await db.from('staff_profiles').upsert(payload,{onConflict:'user_id'});msg.innerHTML='<div class="staff-notice '+(error?'error':'success')+'">'+ESFUI.esc(error?.message||'Staff access saved.')+'</div>';if(!error){form.reset();load()}};setPin.onclick=async()=>{const {data,error}=await db.rpc('set_manager_override_pin',{p_pin:pin.value,p_default_minutes:Number(mins.value)});pinMsg.innerHTML='<div class="staff-notice '+(error||!data?.ok?'error':'success')+'">'+ESFUI.esc(data?.message||error?.message||'Manager PIN updated.')+'</div>';if(!error)pin.value=''};load()});</script></body></html>
