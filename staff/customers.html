<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const staff=await ESFStaff.requireStaff('view_customers');if(!staff)return;const main=ESFUI.mount('customers');main.innerHTML=`<div style="margin-top:30px"><h2 class="staff-page-title">Customers</h2><p class="staff-muted">Customer repair history from tickets.</p><section class="staff-card" style="margin-top:22px"><div class="staff-field"><label>Search customers</label><input id="q" placeholder="Name, phone or email"></div><div id="customers" class="staff-grid"></div></section></div>`;const db=await ESFUI.db();const {data,error}=await db.from('repair_tickets').select('customer_name,customer_phone,customer_email,id,ticket_number,device_brand,device_model,status,created_at').order('created_at',{ascending:false}).limit(1000);if(error){customers.innerHTML=ESFUI.esc(error.message);return}function render(){const term=q.value.toLowerCase(),map=new Map();(data||[]).forEach(r=>{const key=(r.customer_email||r.customer_phone||r.customer_name).toLowerCase();if(!map.has(key))map.set(key,{name:r.customer_name,phone:r.customer_phone,email:r.customer_email,tickets:[]});map.get(key).tickets.push(r)});customers.innerHTML=[...map.values()].filter(c=>!term||[c.name,c.phone,c.email].some(v=>String(v||'').toLowerCase().includes(term))).map(c=>`<article class="staff-card span-6"><h3>${ESFUI.esc(c.name)}</h3><p>${ESFUI.esc(c.phone||'No phone')}<br>${ESFUI.esc(c.email||'No email')}</p><p><b>${c.tickets.length}</b> repair${c.tickets.length===1?'':'s'}</p><div>${c.tickets.slice(0,4).map(t=>`<a href="ticket.html?id=${encodeURIComponent(t.id)}">${ESFUI.esc(t.ticket_number)} • ${ESFUI.esc(t.device_model)}</a>`).join('<br>')}</div></article>`).join('')||'<p>No customers found.</p>'}q.oninput=render;render()});</script></body></html>
