<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/logo.png">
<title>Your Basket</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f7f6f9;
}

header {
    background: #0057b8;
    color: white;
    padding: 20px;
    text-align: center;
}

#cartBox {
    margin: 20px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    border: 2px solid #0057b8;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #ddd;
}

button {
    background: #0057b8;
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>Your Basket</h1>
         <nav>
        <a href="index.html">Home</a>
        <details class="nav-dropdown">

    <summary>
        Shop &amp; Repair
    </summary>

    <div class="dropdown-menu">

        <a href="brands.html">
            Book a Repair
        </a>

        <details class="sub-dropdown">

            <summary>
                Accessories
            </summary>

            <div class="sub-dropdown-menu">

                <a href="cases.html">
                    Cases
                </a>

                <a href="cables.html">
                    Cables
                </a>

                <a href="chargers.html">
                    Chargers
                </a>

                <a href="headphones.html">
                    Headphones
                </a>

                <a href="adapters.html">
                    Adapters
                </a>

                <a href="screen-protectors.html">
                    Screen Protectors
                </a>

                <a href="accessories.html">
                    View All Accessories
                </a>

            </div>

        </details>

    </div>

</details>
        <a href="cart.html" class="cart-link">
            🛒 Basket <span id="cartCount">0</span>
        </a>
     </nav>
</header>
<div id="total"></div>
<div id="cartBox"></div>

<button onclick="window.location.href='brands.html'">add another item</button>
<br>
<button onclick="checkout()">Proceed to Checkout</button>

<script>

let cart = JSON.parse(
    localStorage.getItem("cart")
) || [];

function isAccessory(item) {
    return item && item.type === "accessory";
}

function getQuantity(item) {
    if (!isAccessory(item)) return 1;

    const qty = Number(item.quantity || 1);
    return qty > 0 ? qty : 1;
}

function getUnitPrice(item) {
    return Number(item.price || 0);
}

function getLineTotal(item) {
    return getUnitPrice(item) * getQuantity(item);
}

function getCartCount() {
    return cart.reduce(function(total, item) {
        return total + getQuantity(item);
    }, 0);
}

function renderCart() {

    const box = document.getElementById("cartBox");
    const totalBox = document.getElementById("total");

    box.innerHTML = "";

    document.getElementById(
        "cartCount"
    ).textContent = getCartCount();

    if (cart.length === 0) {

        box.innerHTML =
            "<p>Your basket is empty</p>";

        totalBox.innerHTML =
            "<strong>Total: £0.00</strong>";

        return;
    }

    let total = 0;

    cart.forEach((item, index) => {

        total += getLineTotal(item);

        const div =
            document.createElement("div");

        div.className = "item";

        if (isAccessory(item)) {

            const name =
                item.name ||
                item.model ||
                "Accessory";

            const variation =
                item.variation ||
                item.option ||
                "";

            const quantity =
                getQuantity(item);

            const unitPrice =
                getUnitPrice(item);

            div.innerHTML = `
                <div>
                    <strong>${name}</strong>
                    <br>
                    Accessory
                    ${variation ? `<br><small>${variation}</small>` : ""}
                    <br>
                    Qty: ${quantity}
                    <br>
                    £${unitPrice.toFixed(2)} each
                    ${quantity > 1 ? `<br><strong>Line total: £${getLineTotal(item).toFixed(2)}</strong>` : ""}
                </div>

                <button onclick="removeItem(${index})">
                    Remove
                </button>
            `;

        } else {

            const model =
                item.model ||
                item.device ||
                "Unknown device";

            const repair =
                item.repair ||
                "Repair";

            const quality =
                item.quality ||
                "";

            div.innerHTML = `
                <div>
                    <strong>${model}</strong>
                    <br>
                    ${repair}
                    ${quality ? `<br><small>${quality}</small>` : ""}
                    <br>
                    £${getUnitPrice(item).toFixed(2)}
                </div>

                <button onclick="removeItem(${index})">
                    Remove
                </button>
            `;
        }

        box.appendChild(div);
    });

    totalBox.innerHTML =
        "<strong>Total: £" +
        total.toFixed(2) +
        "</strong>";
}

function removeItem(index) {

    cart.splice(index, 1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    renderCart();
}

function checkout() {

    if (cart.length === 0) {

        alert(
            "Your basket is empty"
        );

        return;
    }

    window.location.href =
        "checkout-choice.html";
}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];

        renderCart();
    }
);

</script>

<script src="social-dropdown.js"></script>
  <script src="whatsapp.js"></script>
</body>
</html>
