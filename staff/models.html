<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Models - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script src="repairflow.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const s=await ESFStaff.requireStaff('system_settings');if(!s)return;const m=ESFUI.mount('models');m.innerHTML='<div style="margin-top:30px"><h2 class="staff-page-title">Device Models</h2><section class="staff-card" style="margin-top:22px"><form id="f" class="rf-inline"><select name="category">'+ESFRF.categories.map(x=>'<option>'+x+'</option>').join('')+'</select><input name="brand" placeholder="Brand" required><input name="model" placeholder="Model" required><button class="staff-btn">Add model</button></form></section><section class="staff-card" style="margin-top:22px"><input id="q" placeholder="Search"><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Category</th><th>Brand</th><th>Model</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>';const db=await ESFUI.db();let a=[];async function load(){const r=await db.from('repair_device_models').select('*').eq('active',true).order('brand').order('model');if(r.error){rows.innerHTML='<tr><td colspan="3">Run the Supabase migration first.</td></tr>';return}a=r.data||[];render()}function render(){const t=q.value.toLowerCase();rows.innerHTML=a.filter(x=>!t||[x.brand,x.model,x.category].some(v=>v.toLowerCase().includes(t))).map(x=>'<tr><td>'+ESFRF.esc(x.category)+'</td><td>'+ESFRF.esc(x.brand)+'</td><td>'+ESFRF.esc(x.model)+'</td></tr>').join('')||'<tr><td colspan="3">No models.</td></tr>'}f.onsubmit=async e=>{e.preventDefault();const r=await db.from('repair_device_models').upsert(Object.fromEntries(new FormData(f).entries()),{onConflict:'category,brand,model'});if(r.error)return alert(r.error.message);f.reset();load()};q.oninput=render;load()});</script></body></html>
