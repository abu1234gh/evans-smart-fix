<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script src="repairflow.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const s=await ESFStaff.requireStaff('view_tickets');if(!s)return;const m=ESFUI.mount('reports');m.innerHTML='<div style="margin-top:30px"><h2 class="staff-page-title">Reports & Analytics</h2><section class="staff-card" style="margin-top:22px"><label>From <input id="from" type="date"></label> <label>To <input id="to" type="date"></label> <button id="run" class="staff-btn">Refresh</button></section><div id="k" class="staff-grid" style="margin-top:22px"></div><section class="staff-card" style="margin-top:22px"><h3>Status breakdown</h3><div id="breakdown"></div></section></div>';const db=await ESFUI.db(),now=new Date();from.value=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);to.value=now.toISOString().slice(0,10);async function load(){const r=await db.from('repair_tickets').select('*').gte('created_at',from.value+'T00:00:00').lte('created_at',to.value+'T23:59:59');if(r.error){k.innerHTML='<div class="staff-card">'+ESFRF.esc(r.error.message)+'</div>';return}const a=r.data||[],value=a.reduce((n,x)=>n+Number(x.final_cost||x.quoted_price||0),0),paid=a.reduce((n,x)=>n+Number(x.amount_paid||0),0),due=a.reduce((n,x)=>n+Number(x.amount_outstanding||0),0);k.innerHTML=[['Repairs',a.length],['Repair value',ESFRF.money(value)],['Collected',ESFRF.money(paid)],['Outstanding',ESFRF.money(due)]].map(x=>'<div class="staff-card staff-stat span-4"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('');const mp={};a.forEach(x=>mp[x.status]=(mp[x.status]||0)+1);breakdown.innerHTML=Object.entries(mp).map(([x,n])=>'<p><b>'+ESFRF.esc(x)+'</b> '+n+'</p>').join('')||'No data'}run.onclick=load;load()});</script></body></html>
