<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Login - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><div class="site-top-strip">Evan's Smart Fix • Authorised Staff Only</div><main class="staff-login-wrap"><section class="staff-login-card"><img class="logo" src="../images/logo.png" alt="Evan's Smart Fix"><h1>Staff Login</h1><p>Repair Desk access for authorised staff.</p><form id="form" class="staff-form"><div class="staff-field full"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="staff-field full"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><div class="staff-field full"><button class="staff-btn" id="btn">Log In</button></div></form><div id="msg"></div><p style="margin-top:18px"><a href="../index.html">← Return to website</a></p></section></main><script src="../auth.js"></script><script src="staff-auth.js"></script><script>const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('btn');(async()=>{const s=await ESFStaff.getStaff();if(s)location.replace('dashboard.html')})();f.onsubmit=async e=>{e.preventDefault();b.disabled=true;m.innerHTML='';try{const db=await ESFAuth.getClient();const {error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error)throw error;const staff=await ESFStaff.getStaff();if(!staff){await db.auth.signOut();throw new Error('This account does not have active staff access.');}location.replace('dashboard.html')}catch(err){m.innerHTML='<div class="staff-notice error">'+String(err.message||'Login failed').replace(/[<>]/g,'')+'</div>'}finally{b.disabled=false}};</script></body></html>
