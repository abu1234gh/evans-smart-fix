<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script src="repairflow.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const s=await ESFStaff.requireStaff('system_settings');if(!s)return;const m=ESFUI.mount('import');m.innerHTML='<div style="margin-top:30px"><h2 class="staff-page-title">CSV Import</h2><section class="staff-card" style="margin-top:22px"><p class="staff-muted">Import device models, parts or customer/device records using a CSV file matching the database column names.</p><label>Type <select id="type"><option value="repair_device_models">Device models</option><option value="repair_parts">Parts</option><option value="repair_devices">Devices</option></select></label><br><br><input id="file" type="file" accept=".csv,text/csv"><br><br><button id="go" class="staff-btn">Import</button><div id="msg"></div></section></div>';const db=await ESFUI.db();function parse(t){const lines=t.split(/\r?\n/).filter(Boolean);const h=lines.shift().split(',').map(x=>x.trim().replace(/^"|"$/g,''));return lines.map(l=>{const v=l.split(',').map(x=>x.trim().replace(/^"|"$/g,''));return Object.fromEntries(h.map((k,i)=>[k,v[i]||'']))})}go.onclick=async()=>{const f=file.files[0];if(!f)return;const rows=parse(await f.text());const target=type.value;for(const r of rows){delete r.id;delete r.created_at;delete r.updated_at;const q=await db.from(target).insert(r);if(q.error){msg.textContent=q.error.message;return}}msg.textContent='Imported '+rows.length+' records.'}});</script></body></html>
