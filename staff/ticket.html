<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repair Ticket - Evan's Smart Fix</title>

<link rel="icon" href="../images/logo.png">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../site-theme.css">
<link rel="stylesheet" href="staff.css">
</head>

<body class="site-redesign staff-body">

<script src="../auth.js"></script>
<script src="staff-auth.js"></script>
<script src="staff-common.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async function () {

    var staff = await ESFStaff.requireStaff('view_tickets');

    if (!staff) {
        return;
    }

    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');

    if (!id) {
        window.location.replace('tickets.html');
        return;
    }

    var main = ESFUI.mount('tickets');
    var db = await ESFUI.db();
    var ticket = null;


    async function load() {

        var result = await db
            .from('repair_tickets')
            .select('*')
            .eq('id', id)
            .single();

        if (result.error) {

            main.innerHTML =
                '<div class="staff-notice error">' +
                ESFUI.esc(result.error.message) +
                '</div>';

            return;
        }

        ticket = result.data;

        render();

        loadHistory();
    }


    function render() {

        var trackUrl = new URL(
            '../track-repair.html',
            window.location.href
        );

        if (ticket.tracking_token) {

            trackUrl.searchParams.set(
                'token',
                ticket.tracking_token
            );
        }

        var trackingUrl = trackUrl.href;


        var createdNotice = '';

        if (
            window.location.search.indexOf('created=1') !== -1
        ) {

            createdNotice =
                '<div class="staff-notice success no-print">' +
                'Ticket created successfully.' +
                '</div>';
        }


        var serial = '';

        if (ticket.serial_imei) {

            serial =
                'IMEI / Serial: ' +
                ESFUI.esc(ticket.serial_imei);
        }


        var accessories = '';

        if (ticket.accessories_left) {

            accessories =
                '<p><b>Accessories:</b> ' +
                ESFUI.esc(ticket.accessories_left) +
                '</p>';
        }


        var internalNotes =
            ticket.internal_notes ||
            'No internal notes.';


        var customerNotes =
            ticket.customer_notes ||
            'No customer-visible update.';


        var trackingSection = '';


        if (ticket.tracking_token) {

            trackingSection =
                '<div ' +
                    'style="margin-top:20px;text-align:center" ' +
                    'id="qrSection">' +

                    '<h3>Customer Tracking</h3>' +

                    '<div ' +
                        'id="qrContainer" ' +
                        'style="display:flex;' +
                        'justify-content:center;' +
                        'align-items:center;' +
                        'min-height:170px;' +
                        'margin:12px 0;">' +
                    '</div>' +

                    '<p class="staff-muted">' +
                        'Scan this QR code to track this repair.' +
                    '</p>' +

                    '<p ' +
                        'class="staff-muted" ' +
                        'style="font-size:12px;' +
                        'word-break:break-all;' +
                        'margin-top:8px;">' +

                        'Tracking code: ' +

                        ESFUI.esc(
                            ticket.tracking_token
                        ) +

                    '</p>' +

                '</div>';

        } else {

            trackingSection =
                '<div ' +
                    'style="margin-top:20px;text-align:center" ' +
                    'id="qrSection">' +

                    '<h3>Customer Tracking</h3>' +

                    '<div class="staff-notice error">' +
                        'No tracking token exists for this ticket.' +
                    '</div>' +

                '</div>';
        }


        main.innerHTML =

            '<div ' +
                'style="margin-top:30px" ' +
                'class="print-ticket">' +


                '<div class="ticket-head">' +

                    '<div>' +

                        '<div class="ticket-number">' +

                            ESFUI.esc(
                                ticket.ticket_number
                            ) +

                        '</div>' +

                        '<p class="staff-muted">' +
                            'Created ' +
                            ESFUI.dt(ticket.created_at) +
                        '</p>' +

                    '</div>' +


                    '<span class="status-pill ' +
                        ESFUI.statusClass(ticket.status) +
                    '">' +

                        ESFUI.esc(ticket.status) +

                    '</span>' +

                '</div>' +


                createdNotice +


                '<div class="staff-grid">' +


                    '<section class="staff-card span-6">' +

                        '<h3>Customer</h3>' +

                        '<p>' +

                            '<b>' +
                                ESFUI.esc(
                                    ticket.customer_name
                                ) +
                            '</b><br>' +

                            ESFUI.esc(
                                ticket.customer_phone || ''
                            ) +

                            '<br>' +

                            ESFUI.esc(
                                ticket.customer_email || ''
                            ) +

                        '</p>' +


                        '<h3 style="margin-top:18px">' +
                            'Device' +
                        '</h3>' +

                        '<p>' +

                            ESFUI.esc(
                                ticket.device_brand
                            ) +

                            ' ' +

                            ESFUI.esc(
                                ticket.device_model
                            ) +

                            '<br>' +

                            serial +

                        '</p>' +


                        '<h3 style="margin-top:18px">' +
                            'Repair' +
                        '</h3>' +

                        '<p>' +

                            ESFUI.esc(
                                ticket.repair_required
                            ) +

                        '</p>' +


                        accessories +

                    '</section>' +



                    '<section class="staff-card span-6">' +

                        '<h3>Ticket Details</h3>' +

                        '<p>' +

                            'Quoted: <b>' +

                            ESFUI.money(
                                ticket.quoted_price
                            ) +

                            '</b><br>' +

                            'Deposit: <b>' +

                            ESFUI.money(
                                ticket.deposit_amount
                            ) +

                            '</b><br>' +

                            'Payments recorded: <b>' +

                            ESFUI.money(
                                ticket.amount_paid
                            ) +

                            '</b>' +

                        '</p>' +


                        '<div ' +
                            'class="staff-field no-print" ' +
                            'style="margin-top:15px">' +

                            '<label for="statusSelect">' +
                                'Status' +
                            '</label>' +

                            '<select id="statusSelect">' +

                                '<option>Received</option>' +
                                '<option>Diagnosing</option>' +
                                '<option>Awaiting Customer Approval</option>' +
                                '<option>Waiting for Parts</option>' +
                                '<option>Repairing</option>' +
                                '<option>Testing</option>' +
                                '<option>Ready for Collection</option>' +
                                '<option>Collected</option>' +
                                '<option>Cancelled</option>' +

                            '</select>' +

                        '</div>' +


                        '<div class="staff-actions no-print">' +

                            '<button ' +
                                'id="updateStatus" ' +
                                'class="staff-btn" ' +
                                'data-permission="update_status">' +
                                'Update Status' +
                            '</button>' +

                            '<button ' +
                                'id="printTicket" ' +
                                'class="staff-btn secondary" ' +
                                'data-permission="print_tickets">' +
                                'Print Ticket' +
                            '</button>' +

                            '<button ' +
                                'id="whatsappBtn" ' +
                                'class="staff-btn secondary">' +
                                '💬 Send to WhatsApp' +
                            '</button>' +

                            '<button ' +
                                'id="refundBtn" ' +
                                'class="staff-btn danger" ' +
                                'data-permission="issue_refunds">' +
                                'Record Refund' +
                            '</button>' +

                            '<button ' +
                                'id="overrideBtn" ' +
                                'class="staff-btn danger">' +
                                'Manager Override' +
                            '</button>' +

                        '</div>' +


                        '<div id="actionMsg"></div>' +


                        trackingSection +


                    '</section>' +



                    '<section class="staff-card span-6">' +

                        '<h3>Internal Notes</h3>' +

                        '<p>' +

                            ESFUI.esc(
                                internalNotes
                            ) +

                        '</p>' +

                    '</section>' +



                    '<section class="staff-card span-6">' +

                        '<h3>Customer Update</h3>' +

                        '<p>' +

                            ESFUI.esc(
                                customerNotes
                            ) +

                        '</p>' +

                    '</section>' +



                    '<section ' +
                        'class="staff-card span-12 no-print">' +

                        '<h3>Activity</h3>' +

                        '<div ' +
                            'id="history" ' +
                            'class="timeline">' +
                        '</div>' +

                    '</section>' +


                '</div>' +

            '</div>';


        var statusSelect =
            document.getElementById(
                'statusSelect'
            );

        var updateStatus =
            document.getElementById(
                'updateStatus'
            );

        var printTicket =
            document.getElementById(
                'printTicket'
            );

        var whatsappBtn =
            document.getElementById(
                'whatsappBtn'
            );

        var refundBtn =
            document.getElementById(
                'refundBtn'
            );

        var overrideBtn =
            document.getElementById(
                'overrideBtn'
            );


        statusSelect.value =
            ticket.status;


        var canRefund =
            ESFStaff.has(
                staff,
                'issue_refunds'
            );


        refundBtn.classList.toggle(
            'hidden',
            !canRefund
        );


        overrideBtn.classList.toggle(
            'hidden',
            canRefund
        );


        updateStatus.classList.toggle(
            'hidden',
            !ESFStaff.has(
                staff,
                'update_status'
            )
        );


        printTicket.onclick = function () {

            window.print();

        };


        var qrContainer =
            document.getElementById(
                'qrContainer'
            );


        if (
            ticket.tracking_token &&
            qrContainer
        ) {

            var qrImage =
                document.createElement(
                    'img'
                );


            qrImage.alt =
                'QR code for tracking repair ' +
                ticket.ticket_number;


            qrImage.width = 150;

            qrImage.height = 150;

            qrImage.style.width =
                '150px';

            qrImage.style.height =
                '150px';

            qrImage.style.display =
                'block';


            qrImage.src =
                'https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=10&data=' +
                encodeURIComponent(
                    trackingUrl
                );


            qrImage.onerror =
                function () {

                    qrContainer.innerHTML =
                        '<div class="staff-notice error">' +
                        'Unable to generate the QR code.' +
                        '</div>';

                };


            qrContainer.appendChild(
                qrImage
            );
        }


        whatsappBtn.onclick =
            function () {

                var phone =
                    String(
                        ticket.customer_phone || ''
                    ).replace(
                        /\D/g,
                        ''
                    );


                if (!phone) {

                    show(
                        'No customer phone number is saved on this ticket.',
                        'error'
                    );

                    return;
                }


                if (
                    phone.indexOf('00') === 0
                ) {

                    phone =
                        phone.slice(2);

                } else if (
                    phone.indexOf('0') === 0
                ) {

                    phone =
                        '44' +
                        phone.slice(1);
                }


                var message =
                    'Hi ' +
                    (
                        ticket.customer_name ||
                        ''
                    ) +
                    ',\n\n' +

                    'Here is your Evan\'s Smart Fix repair ticket ' +
                    ticket.ticket_number +
                    '.\n\n' +

                    'Device: ' +
                    ticket.device_brand +
                    ' ' +
                    ticket.device_model +
                    '\n' +

                    'Repair: ' +
                    ticket.repair_required +
                    '\n\n' +

                    'Track your repair here:\n' +

                    trackingUrl;


                window.open(
                    'https://wa.me/' +
                    phone +
                    '?text=' +
                    encodeURIComponent(
                        message
                    ),
                    '_blank'
                );

            };


        updateStatus.onclick =
            async function () {

                var result =
                    await db
                        .from('repair_tickets')
                        .update({
                            status:
                                statusSelect.value
                        })
                        .eq('id', id);


                if (result.error) {

                    show(
                        result.error.message,
                        'error'
                    );

                    return;
                }


                show(
                    'Status updated.',
                    'success'
                );


                await load();

            };


        refundBtn.onclick =
            function () {

                refundFlow(false);

            };


        overrideBtn.onclick =
            function () {

                refundFlow(true);

            };

    }


    async function refundFlow(
        needsOverride
    ) {

        var amount =
            window.prompt(
                'Refund amount (£):'
            );


        if (amount === null) {
            return;
        }


        var n =
            Number(amount);


        if (
            !Number.isFinite(n) ||
            n <= 0
        ) {

            show(
                'Enter a valid refund amount.',
                'error'
            );

            return;
        }


        var pin = null;


        if (needsOverride) {

            pin =
                window.prompt(
                    'Manager override PIN:'
                );


            if (!pin) {
                return;
            }


            var overrideResult =
                await db.rpc(
                    'grant_refund_override',
                    {
                        p_ticket_id: id,
                        p_amount: n,
                        p_pin: pin
                    }
                );


            if (
                overrideResult.error ||
                !overrideResult.data ||
                !overrideResult.data.ok
            ) {

                show(
                    (
                        overrideResult.data &&
                        overrideResult.data.message
                    ) ||

                    (
                        overrideResult.error &&
                        overrideResult.error.message
                    ) ||

                    'Override denied.',
                    'error'
                );

                return;
            }
        }


        var reason =
            window.prompt(
                'Refund reason:'
            );


        if (!reason) {
            return;
        }


        var refundResult =
            await db.rpc(
                'record_ticket_refund',
                {
                    p_ticket_id: id,
                    p_amount: n,
                    p_reason: reason
                }
            );


        if (
            refundResult.error ||
            !refundResult.data ||
            !refundResult.data.ok
        ) {

            show(
                (
                    refundResult.data &&
                    refundResult.data.message
                ) ||

                (
                    refundResult.error &&
                    refundResult.error.message
                ) ||

                'Refund could not be recorded.',
                'error'
            );

            return;
        }


        show(
            'Refund recorded in the repair system.',
            'success'
        );


        await load();

    }


    function show(
        message,
        type
    ) {

        var actionMsg =
            document.getElementById(
                'actionMsg'
            );


        if (!actionMsg) {
            return;
        }


        actionMsg.innerHTML =
            '<div class="staff-notice ' +
            type +
            '">' +
            ESFUI.esc(message) +
            '</div>';

    }


    async function loadHistory() {

        var result =
            await db
                .from('ticket_audit_log')
                .select('*')
                .eq('ticket_id', id)
                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                )
                .limit(100);


        var history =
            document.getElementById(
                'history'
            );


        if (!history) {
            return;
        }


        history.innerHTML =

            (result.data || [])
                .map(
                    function (x) {

                        var details = '';


                        if (x.details) {

                            details =
                                '<div>' +
                                ESFUI.esc(
                                    JSON.stringify(
                                        x.details
                                    )
                                ) +
                                '</div>';
                        }


                        return (

                            '<div class="timeline-item">' +

                                '<strong>' +

                                    ESFUI.esc(
                                        x.action
                                    ) +

                                '</strong>' +

                                '<small>' +

                                    ESFUI.dt(
                                        x.created_at
                                    ) +

                                    ' • ' +

                                    ESFUI.esc(
                                        x.actor_name ||
                                        'System'
                                    ) +

                                '</small>' +

                                details +

                            '</div>'
                        );

                    }
                )
                .join('') ||

            '<p>No activity yet.</p>';

    }


    await load();

});
</script>

</body>
</html>
