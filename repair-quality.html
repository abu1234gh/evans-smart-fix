const cleanRepair = currentRepair?.trim() || "";

/* =========================================================
   SELECTED DEVICE
========================================================= */

    title.innerHTML = "No device selected";

    title.innerHTML = `${cleanModel}<br>${cleanRepair}`;

/* =========================================================
   ADD TO BASKET
========================================================= */

function addToBasket(quality, price) {

    if (typeof price !== "number" || price <= 0) {

        window.location.href = "contact.html";

        return;
    }

    cart.push({

        model: cleanModel,

        repair: cleanRepair,

        quality: quality,

        price: price

    });

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    document.getElementById("cartCount").textContent = cart.length;

    window.location.href = "cart.html";
}

/* =========================================================
   NORMALISE MODEL
========================================================= */

function normaliseModel(model) {

    return String(model || "")
        .trim()
        .replace(/\s+/g, "")
        .toLowerCase();

}


/* =========================================================
   GET PRICE
========================================================= */

function getPrice(quality) {

    let brand = "";

    const modelLower = cleanModel.toLowerCase();

    if (modelLower.includes("samsung")) {
        brand = "Samsung";
    }

    else if (modelLower.includes("iphone")) {
        brand = "Apple";
    }

    else if (modelLower.startsWith("pixel")) {
        brand = "Google";
    }

    else if (
        motorolaModels.some(model =>
            normaliseModel(model) === normaliseModel(cleanModel)
        )
    ) {
        brand = "Motorola";
    }

    if (!brand) {
        console.error("NO BRAND DETECTED:", cleanModel);
        return 0;
    }

    const matchingModel =
        Object.keys(prices[brand]).find(model =>
            normaliseModel(model) === normaliseModel(cleanModel)
        );

    if (!matchingModel) {
        console.error("NO MODEL MATCH:", cleanModel, "in", brand);
        return 0;
    }

    const matchingRepair =
        Object.keys(prices[brand][matchingModel]).find(repair =>
            normaliseModel(repair) === normaliseModel(cleanRepair)
        );

    if (!matchingRepair) {
        console.error(
            "NO REPAIR/PRICE MATCH:",
            cleanModel,
            cleanRepair,
            quality
        );
        return 0;
    }

    const price =
        prices[brand]?.[matchingModel]?.[matchingRepair]?.[quality];

    console.log({
        model: cleanModel,
        repair: cleanRepair,
        brand,
        matchingModel,
        matchingRepair,
        quality,
        price
    });

    return typeof price === "number" ? price : null;
}


/* =========================================================
   DISPLAY PRICE
========================================================= */

function displayPrice(price) {

    if (typeof price !== "number" || price <= 0) {
        return "Contact Us";
    }

    return "Price: £" + price.toFixed(2);
}


/* =========================================================
   GRADE BUTTONS
========================================================= */

function setupGrade(elementId, priceElementId, quality) {

    const element = document.getElementById(elementId);
    const priceElement = document.getElementById(priceElementId);

    const price = getPrice(quality);

    priceElement.textContent = displayPrice(price);

    if (price > 0) {

        element.addEventListener("click", () => {
            addToBasket(quality, price);
        });

        element.style.cursor = "pointer";

    } else {

        element.style.opacity = "0.55";
        element.style.cursor = "not-allowed";

        element.addEventListener("click", (event) => {

            event.preventDefault();

            window.location.href = "contact.html";

        });

    }

}


setupGrade("GradeA", "priceA", "Original");
setupGrade("GradeB", "priceB", "Grade B");
setupGrade("GradeC", "priceC", "Grade C");

const genuineElement = document.getElementById("Genuine");
genuineElement.style.cursor = "pointer";
genuineElement.addEventListener("click", (event) => {
    event.preventDefault();
    window.location.href = "contact.html";
});


/* =========================================================

========================================================= */

document.getElementById("cartCount").textContent = cart.length;
