<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment Successful - Evan's Smart Fix
    </title>

    <link
        rel="icon"
        href="images/logo.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: #ffffff;
        }

        .payment-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px 25px;
        }

        .payment-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        #status {
            font-size: 18px;
            line-height: 1.6;
        }

        .booking-result {
            display: none;
            margin: 30px auto 0;
            padding: 22px;
            max-width: 520px;
            text-align: left;
            border: 1px solid #dddddd;
            border-radius: 12px;
            background: #f8fafc;
        }

        .booking-result h2 {
            margin-top: 0;
            text-align: center;
        }

        .booking-row {
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .booking-row:last-of-type {
            border-bottom: none;
        }

        .booking-row span {
            display: block;
            font-size: 13px;
            color: #666666;
            margin-bottom: 4px;
        }

        .booking-row strong {
            display: block;
            white-space: pre-line;
            word-break: break-word;
        }

        .return-home-btn {
            display: none;
            margin: 24px auto 0;
            padding: 12px 22px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            background: #0057b8;
            color: #ffffff;
        }

    </style>

</head>

<body>

    <div class="payment-container">

        <div
            class="payment-icon"
            id="paymentIcon"
        >
            ⏳
        </div>

        <h1 id="title">
            Checking Payment
        </h1>

        <p id="status">
            Please wait while we confirm your payment...
        </p>

        <div
            class="booking-result"
            id="bookingResult"
        >
            <h2>Booking Details</h2>

            <div class="booking-row">
                <span>Booking Reference</span>
                <strong id="resultReference"></strong>
            </div>

            <div class="booking-row">
                <span>Name</span>
                <strong id="resultName"></strong>
            </div>

            <div class="booking-row">
                <span>Devices & Repairs</span>
                <strong id="resultBooking"></strong>
            </div>

            <div class="booking-row">
                <span>Total Paid</span>
                <strong id="resultTotal"></strong>
            </div>
        </div>

        <button
            type="button"
            class="return-home-btn"
            id="returnHomeButton"
        >
            Return Home
        </button>

    </div>


    <!-- =====================================================
         EMAILJS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>


    <script>

        /* =====================================================
           EMAILJS
        ===================================================== */

        emailjs.init(
            "fOQMvcH10BYyM_Y9O"
        );


        /* =====================================================
           SUPABASE PAYMENT CHECK FUNCTION
        ===================================================== */

        const CHECK_PAYMENT_URL =
            "https://tblqoawewcyomwgjahry.supabase.co/functions/v1/check-sumup-payment";


        /* =====================================================
           PAGE ELEMENTS
        ===================================================== */

        const statusElement =
            document.getElementById("status");

        const titleElement =
            document.getElementById("title");

        const paymentIcon =
            document.getElementById("paymentIcon");

        const bookingResult =
            document.getElementById("bookingResult");

        const resultReference =
            document.getElementById("resultReference");

        const resultName =
            document.getElementById("resultName");

        const resultBooking =
            document.getElementById("resultBooking");

        const resultTotal =
            document.getElementById("resultTotal");

        const returnHomeButton =
            document.getElementById("returnHomeButton");


        /* =====================================================
           BOOKING DATA
        ===================================================== */

        const booking =
            JSON.parse(
                localStorage.getItem(
                    "bookingData"
                )
            );


        /* =====================================================
           CHECK BOOKING DATA
        ===================================================== */

        if (!booking) {

            titleElement.textContent =
                "Booking Information Missing";

            statusElement.textContent =
                "We couldn't find your booking information. Please contact Evan's Smart Fix.";

            paymentIcon.textContent =
                "⚠️";

            throw new Error(
                "bookingData not found"
            );

        }


        /* =====================================================
           EMAIL / BOOKING HELPERS
        ===================================================== */

        function buildRepairRows(items) {

            if (
                !Array.isArray(items) ||
                !items.length
            ) {

                return `
                    <tr>
                        <td
                            colspan="4"
                            style="
                                padding:12px;
                                border:1px solid #dddddd;
                                text-align:center;
                            "
                        >
                            No repairs selected.
                        </td>
                    </tr>
                `;

            }


            return items.map(function(item) {

                const device =
                    item.model ||
                    item.device ||
                    "Unknown device";

                const repair =
                    item.repair ||
                    "Repair";

                const quality =
                    item.quality ||
                    "Not specified";

                const price =
                    Number(
                        item.price || 0
                    );


                return `
                    <tr>
                        <td style="padding:10px;border:1px solid #dddddd;">
                            ${device}
                        </td>

                        <td style="padding:10px;border:1px solid #dddddd;">
                            ${repair}
                        </td>

                        <td style="padding:10px;border:1px solid #dddddd;">
                            ${quality}
                        </td>

                        <td style="padding:10px;border:1px solid #dddddd;text-align:right;">
                            £${price.toFixed(2)}
                        </td>
                    </tr>
                `;

            }).join("");

        }


        function buildBookingText(items) {

            if (
                booking.booking &&
                String(booking.booking).trim()
            ) {

                return String(
                    booking.booking
                );

            }


            if (
                !Array.isArray(items) ||
                !items.length
            ) {

                return "No repair details available.";

            }


            return items.map(function(item, index) {

                const device =
                    item.model ||
                    item.device ||
                    "Unknown device";

                const repair =
                    item.repair ||
                    "Repair";

                const quality =
                    item.quality ||
                    "Not specified";

                const price =
                    Number(
                        item.price || 0
                    );


                return (
                    "Device " +
                    (index + 1) +
                    ": " +
                    device +
                    "\nRepair: " +
                    repair +
                    "\nQuality: " +
                    quality +
                    "\nPrice: £" +
                    price.toFixed(2)
                );

            }).join(
                "\n\n--------------------\n\n"
            );

        }


        function createEmailParams() {

            const reference =
                booking.reference ||
                booking.booking_reference ||
                booking.order_reference ||
                "";

            const bookingText =
                buildBookingText(
                    booking.items
                );

            const repairRows =
                buildRepairRows(
                    booking.items
                );

            const formattedTotal =
                "£" +
                Number(
                    booking.total || 0
                ).toFixed(2);

            const devices =
                booking.devices ||
                booking.device ||
                "";

            const repairs =
                booking.repairs ||
                booking.repair ||
                "";


            /*
               Multiple aliases are included deliberately.

               EmailJS ignores template variables it does not use,
               so this keeps both your older and newer templates
               compatible.
            */

            return {

                name:
                    booking.name || "",

                customer_name:
                    booking.name || "",

                phone:
                    booking.phone || "",

                customer_phone:
                    booking.phone || "",

                email:
                    booking.email || "",

                customer_email:
                    booking.email || "",

                address:
                    booking.address || "",

                customer_address:
                    booking.address || "",

                reference:
                    reference,

                booking_reference:
                    reference,

                order_reference:
                    reference,

                device:
                    devices,

                devices:
                    devices,

                model:
                    devices,

                repair:
                    repairs,

                repairs:
                    repairs,

                quality:
                    booking.qualities || "",

                qualities:
                    booking.qualities || "",

                prices:
                    booking.prices || "",

                booking:
                    bookingText,

                booking_details:
                    bookingText,

                repair_rows:
                    repairRows,

                booking_repairs:
                    repairRows,

                repairs_table:
                    repairRows,

                repair_details:
                    repairRows,

                total:
                    formattedTotal,

                total_price:
                    formattedTotal,

                amount:
                    Number(
                        booking.total || 0
                    ).toFixed(2),

                checkout_id:
                    booking.sumupCheckoutId || ""

            };

        }


        /* =====================================================
           CHECK SUMUP PAYMENT
        ===================================================== */

        async function checkPayment() {

            try {

                /* =================================================
                   CHECK CHECKOUT ID
                ================================================= */

                if (
                    !booking.sumupCheckoutId
                ) {

                    throw new Error(
                        "SumUp checkout ID not found."
                    );

                }


                /* =================================================
                   UPDATE STATUS
                ================================================= */

                titleElement.textContent =
                    "Checking Payment";

                statusElement.textContent =
                    "Confirming your payment securely...";


                /* =================================================
                   CALL SUPABASE
                ================================================= */

                const response =
                    await fetch(
                        CHECK_PAYMENT_URL,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    checkoutId:
                                        booking.sumupCheckoutId

                                })

                        }
                    );


                /* =================================================
                   READ RESPONSE
                ================================================= */

                const data =
                    await response.json();


                console.log(
                    "SUMUP PAYMENT STATUS:",
                    data
                );


                /* =================================================
                   CHECK API RESPONSE
                ================================================= */

                if (!response.ok) {

                    console.error(
                        "PAYMENT CHECK ERROR:",
                        data
                    );

                    throw new Error(
                        "Unable to verify payment."
                    );

                }


                /* =================================================
                   PAYMENT VALUES
                ================================================= */

                const paymentAmount =
                    Number(
                        data.amount
                    );


                const bookingAmount =
                    Number(
                        booking.total
                    );


                const paymentCurrency =
                    data.currency;


                const paymentStatus =
                    data.status;


                console.log(
                    "Payment status:",
                    paymentStatus
                );

                console.log(
                    "Payment amount:",
                    paymentAmount
                );

                console.log(
                    "Booking amount:",
                    bookingAmount
                );

                console.log(
                    "Currency:",
                    paymentCurrency
                );


                /* =================================================
                   PAYMENT SUCCESSFUL
                ================================================= */

                if (
                    paymentStatus === "PAID" &&
                    paymentCurrency === "GBP" &&
                    paymentAmount === bookingAmount
                ) {

                    paymentIcon.textContent =
                        "✓";

                    titleElement.textContent =
                        "Payment Successful!";

                    statusElement.textContent =
                        "Your payment has been confirmed. Completing your booking...";


                    /* =================================================
                       BUILD EMAIL DATA
                    ================================================= */

                    const emailParams =
                        createEmailParams();


                    console.log(
                        "EMAIL PARAMS:",
                        emailParams
                    );


                    /* =================================================
                       SEND CUSTOMER EMAIL
                    ================================================= */

                    const customerEmailKey =
                        "esf_customer_email_sent_" +
                        booking.sumupCheckoutId;


                    if (
                        !localStorage.getItem(
                            customerEmailKey
                        )
                    ) {

                        try {

                            await emailjs.send(
                                "service_nijiuhj",
                                "template_xqu1fle",
                                emailParams
                            );

                            localStorage.setItem(
                                customerEmailKey,
                                "1"
                            );

                            console.log(
                                "Customer email sent successfully."
                            );

                        } catch (
                            customerEmailError
                        ) {

                            console.error(
                                "CUSTOMER EMAIL ERROR:",
                                customerEmailError
                            );

                        }

                    }


                    /* =================================================
                       SEND BUSINESS EMAIL
                    ================================================= */

                    const businessEmailKey =
                        "esf_business_email_sent_" +
                        booking.sumupCheckoutId;


                    if (
                        !localStorage.getItem(
                            businessEmailKey
                        )
                    ) {

                        try {

                            await emailjs.send(
                                "service_nijiuhj",
                                "template_z80ezit",
                                emailParams
                            );

                            localStorage.setItem(
                                businessEmailKey,
                                "1"
                            );

                            console.log(
                                "Business email sent successfully."
                            );

                        } catch (
                            businessEmailError
                        ) {

                            console.error(
                                "BUSINESS EMAIL ERROR:",
                                businessEmailError
                            );

                        }

                    }


                    /* =================================================
                       CLEAR CART
                    ================================================= */

                    localStorage.removeItem(
                        "cart"
                    );


                    /* =================================================
                       SHOW SUCCESS PAGE
                    ================================================= */

                    const bookingText =
                        buildBookingText(
                            booking.items
                        );


                    titleElement.textContent =
                        "Booking Confirmed!";


                    statusElement.innerHTML =
                        "Your payment has been confirmed and your booking has been received.<br><br>" +
                        "A confirmation email has been sent.";


                    resultReference.textContent =
                        booking.reference ||
                        booking.booking_reference ||
                        booking.order_reference ||
                        "Unavailable";


                    resultName.textContent =
                        booking.name ||
                        "Unavailable";


                    resultBooking.textContent =
                        bookingText;


                    resultTotal.textContent =
                        "£" +
                        Number(
                            booking.total || 0
                        ).toFixed(2);


                    bookingResult.style.display =
                        "block";


                    returnHomeButton.style.display =
                        "inline-block";


                    return;

                }


                /* =================================================
                   PAYMENT STILL PENDING
                ================================================= */

                if (
                    paymentStatus === "PENDING"
                ) {

                    paymentIcon.textContent =
                        "⏳";

                    titleElement.textContent =
                        "Payment Processing";

                    statusElement.textContent =
                        "Your payment is still being processed. Checking again shortly...";


                    setTimeout(
                        checkPayment,
                        3000
                    );


                    return;

                }


                /* =================================================
                   PAYMENT FAILED
                ================================================= */

                if (
                    paymentStatus === "FAILED"
                ) {

                    paymentIcon.textContent =
                        "✕";

                    titleElement.textContent =
                        "Payment Failed";

                    statusElement.textContent =
                        "Your payment was not completed. Please return to your booking and try again.";

                    return;

                }


                /* =================================================
                   PAYMENT EXPIRED
                ================================================= */

                if (
                    paymentStatus === "EXPIRED"
                ) {

                    paymentIcon.textContent =
                        "⌛";

                    titleElement.textContent =
                        "Payment Expired";

                    statusElement.textContent =
                        "This payment session has expired. Please return to your booking and try again.";

                    return;

                }


                /* =================================================
                   AMOUNT / CURRENCY MISMATCH
                ================================================= */

                if (
                    paymentStatus === "PAID" &&
                    (
                        paymentCurrency !== "GBP" ||
                        paymentAmount !== bookingAmount
                    )
                ) {

                    console.error(
                        "PAYMENT MISMATCH",
                        {
                            paymentAmount:
                                paymentAmount,

                            bookingAmount:
                                bookingAmount,

                            paymentCurrency:
                                paymentCurrency
                        }
                    );


                    paymentIcon.textContent =
                        "⚠️";

                    titleElement.textContent =
                        "Payment Verification Issue";

                    statusElement.textContent =
                        "We received a payment response, but the payment details do not match your booking. Please contact Evan's Smart Fix.";

                    return;

                }


                /* =================================================
                   UNKNOWN STATUS
                ================================================= */

                paymentIcon.textContent =
                    "⚠️";

                titleElement.textContent =
                    "Payment Status Unknown";

                statusElement.textContent =
                    "We couldn't confirm your payment status. Please contact Evan's Smart Fix.";

            } catch (error) {

                console.error(
                    "PAYMENT VERIFICATION ERROR:",
                    error
                );


                paymentIcon.textContent =
                    "⚠️";

                titleElement.textContent =
                    "Unable to Confirm Payment";

                statusElement.textContent =
                    "We couldn't confirm your payment right now. Please contact Evan's Smart Fix.";

            }

        }


        /* =====================================================
           RETURN HOME BUTTON
        ===================================================== */

        returnHomeButton.addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "cart"
                );

                localStorage.removeItem(
                    "bookingData"
                );

                window.location.href =
                    "index.html";

            }
        );


        /* =====================================================
           START PAYMENT CHECK
        ===================================================== */

        checkPayment();

    </script>



</body>

</html>
