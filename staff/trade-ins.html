<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade-ins - Evan's Smart Fix</title><link rel="icon" href="../images/logo.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../site-theme.css"><link rel="stylesheet" href="staff.css"></head><body class="site-redesign staff-body"><script src="../auth.js"></script><script src="staff-auth.js"></script><script src="staff-common.js"></script><script src="repairflow.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const s=await ESFStaff.requireStaff('create_tickets');if(!s)return;const m=ESFUI.mount('tradeins');m.innerHTML='<div style="margin-top:30px"><h2 class="staff-page-title">Trade-ins</h2><section class="staff-card" style="margin-top:22px"><form id="f" class="staff-form"><div class="staff-field"><label>Customer</label><input name="customer_name"></div><div class="staff-field"><label>Phone</label><input name="customer_phone"></div><div class="staff-field"><label>Category</label><select name="category">'+ESFRF.categories.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="staff-field"><label>Brand</label><input name="brand"></div><div class="staff-field"><label>Model</label><input name="model"></div><div class="staff-field"><label>IMEI / Serial</label><input name="imei_serial"></div><div class="staff-field"><label>Condition</label><input name="condition"></div><div class="staff-field"><label>Purchase price</label><input name="purchase_price" type="number" step="0.01"></div><div class="staff-field"><label>Store credit</label><input name="store_credit" type="number" step="0.01"></div><div class="staff-field"><label>Resale price</label><input name="resale_price" type="number" step="0.01"></div><div class="staff-field"><label>Status</label><select name="status"><option>Evaluating</option><option>Accepted</option><option>Rejected</option><option>Refurbishing</option><option>Ready for Sale</option><option>Sold</option></select></div><div class="staff-field"><button class="staff-btn">Save trade-in</button></div></form></section><section class="staff-card" style="margin-top:22px"><div class="staff-table-wrap"><table class="staff-table"><thead><tr><th>Date</th><th>Device</th><th>Customer</th><th>Purchase</th><th>Resale</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></div>';const db=await ESFUI.db();async function load(){const r=await db.from('repair_tradeins').select('*').order('created_at',{ascending:false}).limit(100);rows.innerHTML=r.error?'<tr><td colspan="6">Run the Supabase migration first.</td></tr>':(r.data||[]).map(x=>'<tr><td>'+ESFRF.dt(x.created_at)+'</td><td>'+ESFRF.esc([x.brand,x.model].filter(Boolean).join(' '))+'</td><td>'+ESFRF.esc(x.customer_name||'Walk-in')+'</td><td>'+ESFRF.money(x.purchase_price)+'</td><td>'+ESFRF.money(x.resale_price)+'</td><td>'+ESFRF.esc(x.status)+'</td></tr>').join('')||'<tr><td colspan="6">No trade-ins.</td></tr>'}f.onsubmit=async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(f).entries());['purchase_price','store_credit','resale_price'].forEach(k=>p[k]=Number(p[k]||0));const r=await db.from('repair_tradeins').insert(p);if(r.error)return alert(r.error.message);f.reset();load()};load()});</script></body></html>
